name: Sync liferay-portal fork

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

jobs:
  sync_liferay_portal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          repository: ${{ github.repository }}
          path: github-actions

      - name: Checkout liferay-headless/liferay-portal
        uses: actions/checkout@v3
        with:
          repository: 'liferay-headless/liferay-portal'
          token: ${{ secrets.GITHUB_TOKEN }}
          path: liferay-portal

      - name: Sync and find intruders 🦹‍♂️
        run: |
          cd liferay-portal
          SHA=$(git rev-parse HEAD)
          gh repo sync liferay-headless/liferay-portal --source liferay/liferay-portal --branch master
          git pull origin master
          ../github-actions/scripts/intruders.sh "$SHA" > intruders.txt
          if grep -q "Intruders" intruders.txt; then
            gh issue create --title "Intruders 🦹‍♂️" --body "$(cat intruders.txt)" --repo liferay-headless/liferay-portal
          fi
        env:
          GH_TOKEN: ${{ secrets.PAT }}

      - name: Verify fork is in sync
        run: |
          for attempt in 1 2 3; do
            BEHIND=$(gh api repos/liferay/liferay-portal/compare/master...liferay-headless:liferay-portal:master --jq .behind_by)
            if [ "$BEHIND" = "0" ]; then
              echo "liferay-headless/liferay-portal master is in sync with liferay/liferay-portal"
              exit 0
            fi
            echo "Attempt $attempt: fork is $BEHIND commits behind upstream, syncing again"
            gh repo sync liferay-headless/liferay-portal --source liferay/liferay-portal --branch master
            sleep 30
          done
          echo "::error::liferay-headless/liferay-portal master is still behind liferay/liferay-portal after 3 attempts"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.PAT }}
